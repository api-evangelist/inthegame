openapi: 3.0.3
info:
  title: Inthegame admin streamer API
  version: 1.0.0
  description: 'Interactive in-stream overlay and viewer-engagement platform API for OTT/CTV. Two surfaces: adminApi (broadcaster/admin management of streamers, polls, trivia, ratings, wikis, shop, sponsors, prizes, analytics) and userApi (end-viewer play: register/login, answer polls/trivia/ratings, chat, leaderboard, shop). Converted from the provider-published Postman collection "Inthegame API Docs".'
  contact:
    name: Inthegame Support
    email: support@inthegame.io
    url: https://www.inthegame.io/
servers:
- url: https://api-dev.inthegame.io
  description: Published API host (from Postman collection)
tags:
- name: streamer
paths:
  /adminApi/streamer/addPollEngagement/{channelId}:
    post:
      operationId: adminapiStreamerAddpollengagement
      summary: AddPollEngagement
      tags:
      - streamer
      description: Request to engage poll to streamer
      parameters:
      - name: channelId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                pollId:
                  type: string
                time:
                  type: string
            example:
              pollId: 5fbd07fc48196740b75d323b
              time: '25'
      responses:
        '200':
          description: API Test
          content:
            application/json:
              schema:
                type: object
              example:
                poll:
                  id: 5fbd07fc48196740b75d323b
                  name: New Poll
                  question: Test?
                  questionType: poll
                  type: streamer
                  hideButtons: 0
                  image: ''
                  time_limit: 0
                  items:
                  - id: 5fbcee2e636497107a1cbdf4
                    name: test_channel
                  viewType: percentage
                  answers:
                  - answer: Test
                    image: ''
                    reward: 0
                    isRewardSent: false
                    answerSending: false
                  - answer: Live
                    image: ''
                    reward: 0
                    isRewardSent: false
                    answerSending: false
                  answers_statistic: []
                  answers_total: 0
                  prizes: []
        '404':
          description: Not found
        '500':
          description: Server error
      security:
      - AdminToken: []

  /adminApi/user/loginNew:
    get:
      operationId: adminapiUserLogin
      summary: Login
      tags:
      - user
      description: Request to login in admin system, return token and user id, token will be saved in cookies, all rest requests take it for Authentication header for api permission
      parameters:
      - name: username
        in: query
        required: false
        schema:
          type: string
      - name: password
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: API Test
          content:
            application/json:
              schema:
                type: object
              example:
                token: 7c465d9a77540b686e818320c660d964
                userId: 5fbce6c58703d05e5a73b6f4
        '404':
          description: Not found
        '500':
          description: Server error
      security:
      - AdminToken: []
  /adminApi/user/register:
    get:
      operationId: adminapiUserRegister
      summary: Register
      tags:
      - user
      description: Register new user
      parameters:
      - name: username
        in: query
        required: false
        schema:
          type: string
      - name: password
        in: query
        required: false
        schema:
          type: string
      - name: email
        in: query
        required: false
        schema:
          type: string
      - name: broadcasterName
        in: query
        required: false
        schema:
          type: string
      responses:

      operationId: userapiUserLoginbycredentials
      summary: LoginByCredentials
      tags:
      - user
      description: 'Request for login by user/password '
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                request:
                  type: string
            example:
              request: data
      responses:
        '200':
          description: Success
        '404':
          description: Not found
        '500':
          description: Server error

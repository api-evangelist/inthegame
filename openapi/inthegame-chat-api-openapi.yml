  /userApi/chat/chatMessage:
    post:
      operationId: userapiChatSend
      summary: Send
      tags:
      - chat
      description: Send user message and return verified text to client
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                request:
                  type: string
            example:
              request: data
      responses:
        '200':
          description: API Test
          content:
            application/json:
              schema:
                type: object
              example:
                message:
                  message: Hello Bro!Q!!
                  username: Cool User
                  userId: 5fbfbf7b7938293c320ac1dc
        '404':
          description: Not found
        '500':
          description: Server error
  /userApi/chat/deleteChatMessage:
    post:
      operationId: userapiChatDelete
      summary: Delete
      tags:
      - chat
      description: Delete message from chat with provided id
      requestBody:
        content:
          application/x-www-form-urlencoded:

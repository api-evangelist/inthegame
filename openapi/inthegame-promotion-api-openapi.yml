  /adminApi/prize/getById/{id}:
    get:
      operationId: adminapiPromotionGetbyid
      summary: GetById
      tags:
      - promotion
      description: Return promotion object selected by given id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: API Test
          content:
            application/json:
              schema:
                type: object
              example:
                prize:
                  name: test promo
                  place: ''
                  streamers:
                  - id: 5fbcee2e636497107a1cbdf4
                    channel_name: test_channel
                  description: test
                  url: test.com
                  thumbnail: ''
                  itemType: big
                  items: []
                  content: '<h1>Welcome to my channel</h1>

                    '
                  sponsor: 5fbcee9ce1a5930b1508c482
                  type: offers
                  viewType:
                  - flip
                  secondsDelay: 5
                  user_id: 5fbce6c58703d05e5a73b6f4
                  offersOptions:

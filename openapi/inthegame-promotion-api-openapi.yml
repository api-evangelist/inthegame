  /adminApi/prize/update/{prizeId}:
    post:
      operationId: adminapiPromotionUpdate
      summary: Update
      tags:
      - promotion
      description: Send promotion object to update in db with given id and return updated promotion
      parameters:
      - name: prizeId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                place:
                  type: string
                streamers:
                  type: string
                description:
                  type: string
                url:
                  type: string
                thumbnail:
                  type: string
                itemType:
                  type: string
                items:
                  type: string
                content:
                  type: string
                sponsor:
                  type: string
                type:
                  type: string
                viewType:
                  type: string
                secondsDelay:
                  type: string
                user_id:
                  type: string
                offersOptions:
                  type: string
                meta:
                  type: string
                lastSentTime:
                  type: string
                _id:
                  type: string
            example:
              name: test promo
              place: ''
              streamers: '[object Object]'
              description: test
              url: test.com
              thumbnail: ''
              itemType: big
              items: ''
              content: <h1>Welcome to my channel</h1>
              sponsor: 5fbcee9ce1a5930b1508c482
              type: offers
              viewType: flip
              secondsDelay: '5'
              user_id: 5fbce6c58703d05e5a73b6f4
              offersOptions: '[object Object]'
              meta: '[object Object]'
              lastSentTime: '1606225889'
              _id: '[object Object]'
      responses:

                  description: test
                  url: test.com
                  thumbnail: ''
                  sponsorLogo: ''
                  itemType: big
                  items: []
                  content: '<h1>Welcome to my channel</h1>

                    '
                  sponsor: 5fbcee9ce1a5930b1508c482
                  type: offers
                  viewType:
                  - flip
                  secondsDelay: 5
                  offersOptions:
                    sendToChat: true
                    chatMessage: Welcome!!!
                    interval: '1'
                  meta:

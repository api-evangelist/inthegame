        schema:
          type: string
      responses:
        '200':
          description: API Test
          content:
            application/json:
              schema:
                type: object
              example:
                entity:
                  name: Test entity
                  user_id: 5fbce6c58703d05e5a73b6f4
                  thumbnail: ''
                  _id:
                    $id: 5fbcf1b14ad5926a962b7f97
        '404':
          description: Not found
        '500':
          description: Server error

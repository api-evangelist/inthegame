  /adminApi/entity/update/{id}:
    post:
      operationId: adminapiEntityUpdate
      summary: Update
      tags:
      - entity
      description: Send entity object to update in db with given id and return updated entity
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                user_id:
                  type: string

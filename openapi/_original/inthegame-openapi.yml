openapi: 3.0.3
info:
  title: Inthegame API
  version: 1.0.0
  description: 'Interactive in-stream overlay and viewer-engagement platform API for OTT/CTV. Two surfaces:
    adminApi (broadcaster/admin management of streamers, polls, trivia, ratings, wikis, shop, sponsors,
    prizes, analytics) and userApi (end-viewer play: register/login, answer polls/trivia/ratings, chat,
    leaderboard, shop). Converted from the provider-published Postman collection "Inthegame API Docs".'
  contact:
    name: Inthegame Support
    email: support@inthegame.io
    url: https://www.inthegame.io/
servers:
- url: https://api-dev.inthegame.io
  description: Published API host (from Postman collection)
tags:
- name: admin
- name: streamer
- name: promotion
- name: analytics
- name: entity
- name: item
- name: moderationData
- name: poll
- name: category
- name: rating
- name: shop
- name: sponsor
- name: translations
- name: trivia
- name: uploads
- name: user
- name: wiki
- name: general
- name: leaderboard
- name: chat
- name: socket
components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: Authorization
      description: Admin API token issued after login to the admin panel (https://admintest.inthegame.io/);
        sent in the Authorization header.
paths:
  /admin/currentUser:
    get:
      operationId: adminapiAdminGetcurrentuser
      summary: GetCurrentUser
      tags:
      - admin
      description: Gets current logged user object by token saved in cookies. Requested every time page
        loads for applying some actions on server.
      responses:
        '200':
          description: API Test
          content:
            application/json:
              schema:
                type: object
              example:
                name: api_tester
                password: 5d93ceb70e2bf5daa84ec3d0cd2c731a
                email: leonid.arenshteyn@inthegame.io
                broadcaster_name: api_tester
                type: moderator
                _id:
                  $id: 5fbce6c58703d05e5a73b6f4
        '404':
          description: Not found
        '500':
          description: Server error
      security:
      - AdminToken: []
  /adminApi/analytics/getParameters:
    get:
      operationId: adminapiAnalyticsGetparameters
      summary: GetParameters
      tags:
      - analytics
      description: Get help data for drop down in filter
      parameters:
      - name: per-page
        in: query
        required: false
        schema:
          type: string
        example: '10000'
      responses:
        '200':
          description: API Test
          content:
            application/json:
              schema:
                type: object
              example:
                devices:
                - deviceName: Android
                - deviceName: iPhone
                - deviceName: iPad
                - deviceName: BlackBerry
                platforms:
                - platformName: mobile
                - platformName: web
                countries:
                - countryCode: US
                  countryName: United States
                - countryCode: IL
                  countryName: Israel
                browsers:
                - browserName: Chrome
                - browserName: Safari
                - browserName: Firefox
                - browserName: MSIE
                type: new
        '404':
          description: Not found
        '500':
          description: Server error
      security:
      - AdminToken: []
  /adminApi/analytics/getReport:
    get:
      operationId: adminapiAnalyticsGetreport
      summary: GetReport
      tags:
      - analytics
      description: Get report for analytics user actions from client (activities)
      responses:
        '200':
          description: API Test
          content:
            application/json:
              schema:
                type: object
              example:
                report:
                - module: Rating
                  impressions: 2
                  engagements: 0
                  engagementRatio: 0
                  clicks: 0
                  ctr: 0
                  subModules:
                  - module: Harry Potter
                    impressions: 2
                    engagements: 0
                    ctr: 0
                    clicks: 0
                    engagementRatio: 0
                - module: Polls
                  impressions: 2
                  engagements: 0
                  engagementRatio: 0
                  clicks: 0
                  ctr: 0
                  subModules:
                  - module: Test poll
                    impressions: 2
                    engagements: 0
                    ctr: 0
                    clicks: 0
                    engagementRatio: 0
                - module: Quiz
                  impressions: 1
                  engagements: 0
                  engagementRatio: 0
                  clicks: 0
                  ctr: 0
                  subModules:
                  - module: Which year Harry Potter was born?
                    impressions: 1
                    engagements: 0
                    ctr: 0
                    clicks: 0
                    engagementRatio: 0
                - module: Wiki
                  impressions: 5
                  engagements: 0
                  engagementRatio: 0
                  clicks: 0
                  ctr: 0
                  subModules:
                  - module: Test Wiki
                    impressions: 5
                    engagements: 0
                    ctr: 0
                    clicks: 0
                    engagementRatio: 0
                - module: Chat
                  impressions: 1
                  engagements: 1
                  engagementRatio: 1
                  clicks: 0
                  ctr: 0
                  subModules: []
                - module: Account
                  impressions: 1
                  engagements: 1
                  engagementRatio: 1
                  clicks: 0
                  ctr: 0
                  subModules: []
                type: new
        '404':
          description: Not found
        '500':
          description: Server error
      security:
      - AdminToken: []
  /adminApi/entity/create:
    post:
      operationId: adminapiEntityCreate
      summary: Create
      tags:
      - entity
      description: Send new entity object to save and return it as db object
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                thumbnail:
                  type: string
            example:
              name: Test Entity
              thumbnail: ''
      responses:
        '200':
          description: API Test
          content:
            application/json:
              schema:
                type: object
              example:
                entity:
                  name: Test Entity
                  user_id: 5fbce6c58703d05e5a73b6f4
                  thumbnail: ''
                  _id:
                    $id: 5fbd14d40174d8346b7cceb4
